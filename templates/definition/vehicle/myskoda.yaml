template: myskoda
products:
  - brand: Škoda
    description:
      generic: MyŠkoda (Public API)
requirements:
  description:
    de: API-Schlüssel unter [go.skoda.eu/api-keys](https://go.skoda.eu/api-keys) anfordern.
    en: Request an API key at [go.skoda.eu/api-keys](https://go.skoda.eu/api-keys).
params:
  - preset: vehicle-common
  - preset: vehicle-online
  - name: positionprofiledisabled
    type: bool
    advanced: true
    description:
      de: Ladegrenze des Ladestandorts deaktivieren
      en: Disable charging location charge limit
    help:
      de: Die maximale Ladegrenze des aktuellen Ladestandorts ignorieren und stattdessen
        die maximale Ladegrenze des Fahrzeugs verwenden.
      en: Ignore the maximum charge limit of the vehicle's current charging location and
        use the vehicle's own maximum charge limit instead.
  - name: welcomecharge
    advanced: true
  - name: apikey
    required: true
    help:
      de: API-Schlüssel unter [go.skoda.eu/api-keys](https://go.skoda.eu/api-keys) anfordern.
      en: Request an API key at [go.skoda.eu/api-keys](https://go.skoda.eu/api-keys).
  - name: vin
    required: true
  - name: sandbox
    type: bool
    advanced: true
    description:
      de: Sandbox-Umgebung
      en: Sandbox environment
  - name: cache
    default: 15m
    advanced: true
  - name: timeout
render: |
  type: myskoda
  vin: {{ .vin }}
  apikey: {{ .apikey }}
  {{- if .sandbox }}
  sandbox: true
  {{- end }}
  {{- if .positionprofiledisabled }}
  positionprofiledisabled: true
  {{- end }}
  {{ include "common" . }}
  cache: {{ .cache }}
  timeout: {{ .timeout }}
  {{ include "features" . }}
